name: Release

# Publishing a GitHub release for a v* tag (written by hand on the Releases page) starts this.
# After approval on the nuget environment, the tag's Build outputs are pushed to NuGet.org and attached to the release.
# To retry, run it by hand on the tag (Use workflow from -> Tags); both steps are safe to repeat.
# Either way it runs this file as it was at the tag, so fixes here only apply to later tags.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "可选：指定包版本（例如 0.11.0-icc.1）。留空则自动用 <VersionPrefix>-icc.<提交短哈希>"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: nuget  # the required reviewers on this environment approve every release
    permissions:
      actions: read    # download the tag build's artifacts
      contents: write  # attach files to the release
      id-token: write  # NuGet trusted publishing
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Build uploads the nupkg and the Gallery zip unwrapped (archive: false): each artifact is named after its file.
      - name: Find the tag's build
        id: build
        run: |
          run_id=$(gh run list --workflow build.yml --branch "$TAG" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful Build run for $TAG yet. Wait for it to finish (or re-run it), then re-run this workflow."
            exit 1
          fi
          artifacts=$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.expired | not) | .name')
          package=$(grep -E '\.nupkg$' <<< "$artifacts" || true)
          gallery=$(grep -E '^iNKORE\.UI\.WPF\.Modern\.Gallery@.*\.zip$' <<< "$artifacts" || true)
          if [ -z "$package" ] || [ -z "$gallery" ]; then
            echo "::error::Build run $run_id for $TAG has no package or Gallery artifact (expired?). Re-run that build, then this workflow."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "gallery=$gallery" >> "$GITHUB_OUTPUT"

      # download-artifact unzips anything served as a zip, which would unpack the Gallery zip into dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.build.outputs.package }}
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
          skip-decompress: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.build.outputs.gallery }}
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
          skip-decompress: true

      # dotnet nuget push needs an SDK; install one rather than rely on what the runner image happens to ship.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push "dist/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Attach files to the release
        run: gh release upload "$TAG" "dist/$PACKAGE" "dist/$GALLERY" --clobber
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
          GALLERY: ${{ steps.build.outputs.gallery }}

  # 一键发布：Actions -> Release -> Run workflow（分支选 main），不用打 tag、不用手写版本号。
  # 版本默认是 <VersionPrefix>-icc.<提交短哈希>，每次提交都不一样，天然不会互相覆盖；
  # 真想指定版本时，在 version 输入框里写（例如 0.11.0-icc.1）。
  publish-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: windows-latest
    environment: nuget  # 想加人工闸门就在这里配 required reviewers
    permissions:
      contents: read
      id-token: write  # NuGet trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 需要 tag 才能用 git describe 推出基础版本号
          fetch-tags: true

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if (-not $version) {
            $sha = "${{ github.sha }}".Substring(0, 7)
            # 基础版本号跟着最近的 v* tag 走（v0.11.0 -> 0.11.0），上游发新 tag 后自动跟进。
            $tag = (git describe --tags --abbrev=0 2>$null)
            if ($tag -match '^v(\d+\.\d+\.\d+)') {
              $base = $Matches[1]
            } else {
              $base = msbuild source/iNKORE.UI.WPF.Modern.Controls/iNKORE.UI.WPF.Modern.Controls.csproj -getProperty:VersionPrefix
            }
            $version = "$base-icc.$sha"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            Write-Error "版本号 '$version' 不合法：要形如 1.2.3 或 1.2.3-icc.1"
            exit 1
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "本次发布版本：$version"

      - name: Build
        shell: pwsh
        run: >-
          msbuild iNKORE.UI.WPF.Modern.sln -restore -p:Configuration=Release "-p:Platform=Any CPU"
          -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        shell: pwsh
        run: >-
          msbuild source/iNKORE.UI.WPF.Modern.Controls/iNKORE.UI.WPF.Modern.Controls.csproj -t:Pack
          -p:NoBuild=true -p:Configuration=Release -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.VERSION }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          # Windows 上的 dotnet nuget push 不认识含斜杠的通配符（dist/*.nupkg 会报
          # "File does not exist"），所以这里自己解析出完整路径再传给它。
          $package = Get-ChildItem .nuget -Filter *.nupkg | Select-Object -First 1
          if (-not $package) {
            Write-Error ".nuget 下没有生成 nupkg，先看上面的 Pack 步骤"
            exit 1
          }
          Write-Host "推送 $($package.Name)（$($package.Length) 字节）"
          dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
